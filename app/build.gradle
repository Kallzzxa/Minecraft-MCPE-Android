apply plugin: 'com.android.application'

android {
    compileSdkVersion 30
    buildToolsVersion "30.0.3"

    defaultConfig {
        applicationId "com.custom.minecraftpe"
        minSdkVersion 21
        targetSdkVersion 30
        versionCode 10
        versionName "0.6.1"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }

        externalNativeBuild {
            ndkBuild {
                // RakNet module lives at <repo-root>/raknet; the
                // minecraftpe Android.mk imports it via
                // $(call import-module, raknet/jni).
                arguments "NDK_MODULE_PATH=" + rootDir.absolutePath
            }
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard.cfg'
        }
        debug {
            debuggable true
            jniDebuggable true
        }
    }

    lintOptions {
        abortOnError false
    }
}

// The Verizon-specific activity is excluded, same as the old build.
android.sourceSets.main.java.exclude '**/Minecraft_Verizon.java'
